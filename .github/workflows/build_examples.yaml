name: Build Examples

# Triggers the workflow on push or pull request events
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_examples:
    permissions:
      contents: read
    name: Build Examples
    if: ${{ ! contains(github.event.head_commit.message, 'ci skip') }}
    uses: EnviroDIY/workflows/.github/workflows/build_examples.yaml@main
    with:
      examples_to_ignore: 'extras/tools/AT_Debug,extras/tools/AT_Spy,examples/more/Hologram_Dash,extras/tools/EspressifUpdateFirmware'
      arduino_fqbns_to_ignore: 'arduino:zephyr_main:nicla_sense'
      pio_envs_to_ignore: 'esp32-c6-devkitm-1,arduino_nano_esp32'
      log_grouping_fields: 'compiler,inline_defines,core_platform,board,compiler_flags,example'
      job_grouping_fields: 'compiler,inline_defines,core_platform'
