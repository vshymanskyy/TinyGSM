; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ${platformio.core_dir}/boards

[env]
framework = arduino
lib_ldf_mode = deep+
build_flags =
    -Wall
    -Wextra
    -D TINY_GSM_RX_BUFFER=64
    -D SerialAT=Serial
lib_ignore =
    .git
    .pio
    .vscode
    .history


; ------------------------------------------------------------
;  ARDUINO AVR FAMILY
; ------------------------------------------------------------

[arduino_avr_base]
platform = atmelavr
lib_ignore =
    ${env.lib_ignore}
    RTCZero
    Adafruit TinyUSB Library
    ESP8266SdFat

; Secondary base for AVR boards that use FAT/SPI/SdFat flags
[arduino_avr_fat_base]
extends = arduino_avr_base
build_flags =
    ${env.build_flags}
    -Wno-unused-parameter
    -Wno-unused-value
    -D USE_FAT_FILE_FLAG_CONTIGUOUS=0
    -D ENABLE_DEDICATED_SPI=0
    -D SDFAT_FILE_TYPE=1
    -D SD_FAT_TYPE=1
    -D CHECK_FLASH_PROGRAMMING=0


; --- Simple AVR boards (no FAT flags) ---
[env:mayfly]
extends = arduino_avr_base
board = mayfly

[env:mayfly_hex]
extends = env:mayfly
build_flags =
    ${env.build_flags}
    -D TINY_GSM_USE_HEX

[env:megaatmega2560]
extends = arduino_avr_base
board = megaatmega2560


; --- FAT‑enabled AVR boards (extend the secondary base) ---
[env:uno]
extends = arduino_avr_fat_base
board = uno

[env:feather328p]
extends = arduino_avr_fat_base
board = feather328p

[env:leonardo]
extends = arduino_avr_fat_base
board = leonardo

[env:yun]
extends = arduino_avr_fat_base
board = yun

[env:feather32u4]
extends = arduino_avr_fat_base
board = feather32u4


